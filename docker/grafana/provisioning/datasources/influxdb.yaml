# Auto-provisioned at Grafana startup. To change the datasource, edit this
# file and restart the grafana container (docker compose restart grafana).
#
# Values must match docker-compose.yml's influxdb env block:
#   organization → DOCKER_INFLUXDB_INIT_ORG
#   defaultBucket → DOCKER_INFLUXDB_INIT_BUCKET
#   token → DOCKER_INFLUXDB_INIT_ADMIN_TOKEN

apiVersion: 1

datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: trading
      defaultBucket: latency
      tlsSkipVerify: true
    secureJsonData:
      token: dev-trading-bot-token
